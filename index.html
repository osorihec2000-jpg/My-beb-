<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1769e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Bebé">
  <link rel="manifest" href="./manifest.webmanifest">
  
  <style>

1px solid #edf0f5;border-radius:15px;padding:13px;display:flex;justify-content:space-between}.record-main{display:flex;gap:10px;align-items:center}.record-icon{font-size:22px}.record small{color:#8992a3}.empty{padding:25px;text-align:center;color:#8992a3;background:#fff;border-radius:16px}.bottom-nav{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid #e9edf3;display:flex;justify-content:space-around}.nav{border:0;background:none;color:#8b94a6;font-size:21px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px}.nav span{font-size:10px}.nav.active{color:#1769e0}.modal{position:fixed;inset:0;background:#0005;z-index:20;display:flex;align-items:flex-end}.modal[hidden]{display:none}.sheet{width:min(520px,100%);margin:auto;background:#fff;border-radius:26px 26px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:#f0f2f6;border-radius:50%;width:34px;height:34px;font-size:23px}.sheet h2{margin:0 35px 20px;font-size:22px}.form{display:grid;gap:13px}.form label{font-size:13px;color:#667085;font-weight:650}.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid #dfe4ec;border-radius:13px;font:inherit;background:#fafbfc}.form textarea{min-height:90px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px}.btn{padding:13px;border-radius:13px;border:1px solid #dce2eb;background:#fff;font-weight:700}.btn.primary-btn{background:#1769e0;color:#fff;border-color:#1769e0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{padding:12px 5px;border:1px solid #dfe4ec;border-radius:13px;background:#fff}.choice.selected{border-color:#1769e0;background:#eaf2ff;color:#1769e0}.menu{display:grid;gap:1 </style>
  <title>Mi Bebé 🩵</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Mi pequeño</p>
        <h1>Liam <span>🩵</span></h1>
        <p id="babyAge" class="age">Calculando edad…</p>
      </div>
      <button class="avatar" id="photoBtn" aria-label="Agregar foto">👶</button>
      <input id="photoInput" type="file" accept="image/*" hidden>
    </header>
<section class="card next-feed-card">

  <div class="next-feed-icon">🍼</div>

  <div class="next-feed-content">

    <span>PRÓXIMA TOMA</span>

    <strong id="nextFeedTime">Sin toma programada</strong>

    <small id="nextFeedCountdown">Registra una toma para programarla</small>

  </div>

</section>
    <section class="hero card">
      <div>
        <span class="pill">Hoy</span>
        <h2>Resumen del día</h2>
        <p id="todayLabel"></p>
      </div>
      <div class="hero-date" id="dayNumber"></div>
    </section>

    <section class="grid">
      <article class="stat card" data-open="feeding">
        <div class="stat-icon blue">🍼</div>
        <div><span>Alimentación</span><strong id="feedSummary">Sin registros</strong></div>
      </article>
      <article class="stat card" data-open="sleep">
        <div class="stat-icon purple">😴</div>
        <div><span>Sueño</span><strong id="sleepSummary">Sin registros</strong></div>
      </article>
      <article class="stat card" data-open="diaper">
        <div class="stat-icon yellow">🧷</div>
        <div><span>Pañales</span><strong id="diaperSummary">0 hoy</strong></div>
      </article>
      <article class="stat card" data-open="growth">
        <div class="stat-icon green">⚖️</div>
        <div><span>Último peso</span><strong id="weightSummary">Sin registros</strong></div>
      </article>
    </section>

    <button class="primary" id="quickAdd">＋ Registrar actividad</button>

    <section class="section">
      <div class="section-title"><h2>Últimos registros</h2><button class="link" id="viewAll">Ver todo</button></div>
      <div id="recentList" class="list"></div>
    </section>

    <nav class="bottom-nav">
      <button class="nav active" data-tab="home">⌂<span>Inicio</span></button>
      <button class="nav" data-tab="activity">✚<span>Actividades</span></button>
      <button class="nav" data-tab="growth">⌁<span>Crecimiento</span></button>
      <button class="nav" data-tab="diary">♡<span>Diario</span></button>
      <button class="nav" data-tab="more">☰<span>Más</span></button>
    </nav>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="sheet">
      <button class="close" id="closeModal">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body>
</html>
